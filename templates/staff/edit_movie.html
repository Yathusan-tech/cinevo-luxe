{% extends "staff/base_staff.html" %}

{% block title %}Edit Movie{% endblock %}

{% block content %}
<div class="dashboard-header">
    <h1>Edit Movie</h1>
    <a href="{{ url_for('staff_movies') }}" style="color: var(--text-sub); text-decoration: none; font-size: 13px; font-weight: 600;">&larr; Back to Movies</a>
</div>

<div class="section-box">
    <div class="section-title">Update {{ movie.title }}</div>
    <form action="{{ url_for('staff_update_movie', movie_id=movie.id) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <input type="text" name="title" class="form-control" value="{{ movie.title }}" placeholder="Movie Title *" required>
            <input type="text" name="genre" class="form-control" value="{{ movie.genre }}" placeholder="Genre *" required>
            <input type="text" name="format" class="form-control" value="{{ movie.format }}" placeholder="Format *" required>
            <input type="number" name="rating" class="form-control" value="{{ movie.rating }}" min="0" max="10" step="0.1" placeholder="Rating">
        </div>
        <div class="form-row">
            <input type="text" name="age_rating" class="form-control" value="{{ movie.age_rating }}" placeholder="Age Rating *" required>
            <input type="text" name="duration" class="form-control" value="{{ movie.duration }}" placeholder="Duration *" required>
            <input type="url" name="poster" class="form-control" value="{{ movie.poster }}" placeholder="Poster URL *" required>
            <input type="url" name="backdrop" class="form-control" value="{{ movie.backdrop or '' }}" placeholder="Backdrop URL">
        </div>
        <div class="form-row">
            <select name="category" class="form-control">
                <option value="now_showing" {% if movie.category == 'now_showing' %}selected{% endif %}>Now Showing</option>
                <option value="premiere" {% if movie.category == 'premiere' %}selected{% endif %}>Premiere Screening</option>
                <option value="imax" {% if movie.category == 'imax' %}selected{% endif %}>IMAX Experience</option>
            </select>
            <select name="status" class="form-control">
                <option value="Now Showing" {% if movie.status == 'Now Showing' %}selected{% endif %}>Now Showing</option>
                <option value="Coming Soon" {% if movie.status == 'Coming Soon' %}selected{% endif %}>Coming Soon</option>
                <option value="Inactive" {% if movie.status == 'Inactive' %}selected{% endif %}>Inactive</option>
            </select>
            <input type="url" name="trailer_url" class="form-control" value="{{ movie.trailer_url or '' }}" placeholder="Trailer URL">
            <input type="text" name="language" class="form-control" value="{{ movie.language or '' }}" placeholder="Language">
        </div>
        <div class="form-row">
            <input type="text" name="cast" class="form-control" value="{{ movie.cast or '' }}" placeholder="Cast">
            <input type="text" name="director" class="form-control" value="{{ movie.director or '' }}" placeholder="Director">
        </div>
        <div class="form-row">
            <textarea name="description" class="form-control" rows="5" placeholder="Synopsis / Description" style="grid-column: 1 / -1; resize: vertical;" required>{{ movie.description }}</textarea>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button type="submit" class="btn-gold" style="padding: 10px 20px;">Save Changes</button>
            <a href="{{ url_for('staff_movies') }}" style="color: var(--text-sub); text-decoration: none; font-size: 13px; font-weight: 600;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
