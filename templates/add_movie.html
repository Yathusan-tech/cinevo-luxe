<!DOCTYPE html>
<html>
<head>
    <title>Add Movie</title>
    <style>
        body { background: #0b0d14; color: #fff; font-family: sans-serif; padding: 40px; }
        form { max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        input, textarea { padding: 10px; background: #141724; border: 1px solid #333; color: #fff; border-radius: 6px; }
        button { padding: 12px; background: #6366f1; border: none; color: #fff; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Add Movie</h2>
    <form method="POST">
        <input type="text" name="name" placeholder="Movie Name" required>
        <input type="text" name="genre" placeholder="Genre">
        <input type="text" name="duration" placeholder="Duration (e.g. 2h 30m)">
        <input type="text" name="rating" placeholder="Rating (e.g. 8.5)">
        <input type="text" name="poster" placeholder="Poster Image URL">
        <textarea name="description" placeholder="Description"></textarea>
        <button type="submit">Add Movie</button>
    </form>
</body>
</html>
