<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0d14; color: #fff; font-family: sans-serif; padding: clamp(16px, 4vw, 40px); margin: 0; }
        form { max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
        input, textarea { width: 100%; padding: 12px; background: #141724; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 16px; }
        button { padding: 12px; background: #6366f1; border: none; color: #fff; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; min-height: 44px; }
    </style>
</head>
<body>
    <h2>Add Movie</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="name" placeholder="Movie Name" required>
        <input type="text" name="genre" placeholder="Genre">
        <input type="text" name="duration" placeholder="Duration (e.g. 2h 30m)">
        <input type="text" name="rating" placeholder="Rating (e.g. 8.5)">
        <input type="text" name="poster" placeholder="Poster Image URL">
        <textarea name="description" placeholder="Description"></textarea>
        <button type="submit">Add Movie</button>
    </form>
</body>
</html>
