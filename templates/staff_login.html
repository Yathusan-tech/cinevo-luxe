<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff & Administration Portal | Cinevo Luxe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        :root {
            --bg-body: #07090e;
            --bg-surface: #0f131c;
            --bg-card: #151a26;
            --border-container: rgba(255, 255, 255, 0.1);
            --border-gold: rgba(212, 175, 55, 0.35);
            --gold-primary: #e5c158;
            --gold-grad: linear-gradient(135deg, #eed285 0%, #b88e28 100%);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-gold);
            border-radius: 18px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(229, 193, 88, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 6px;
        }
        .brand-title span { color: var(--gold-primary); }
        .login-subtitle { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }

        .alert-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-container);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--gold-primary); }

        .btn-staff-login {
            width: 100%;
            background: var(--gold-grad);
            color: #07090e;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(184, 142, 40, 0.25);
            transition: all 0.2s;
        }
        .btn-staff-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(244, 223, 155, 0.35); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--gold-primary); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="brand-title">CINEVO <span>LUXE</span></div>
        <div class="login-subtitle">Staff & Management Portal</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert-box">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('staff_login') }}">
        <div class="form-group">
            <label class="form-label" for="username">Staff Username</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter staff username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter secure password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-staff-login">
            Authenticate & Access Dashboard
        </button>
    </form>

    <a href="{{ url_for('home') }}" class="back-link">&larr; Return to Public Website</a>
</div>

</body>
</html>
