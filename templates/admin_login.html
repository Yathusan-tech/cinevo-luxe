<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { background: #0b0d14; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        form { background: #141724; padding: 30px; border-radius: 12px; text-align: center; width: 300px; }
        input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; }
        button { width: 100%; padding: 10px; background: #6366f1; border: none; color: #fff; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <form method="POST">
        <h2>Admin Login</h2>
        <input type="password" name="password" placeholder="Password (admin)" required>
        <button type="submit">Login</button>
    </form>
</body>
</html>
